server:
  port: ${PORT:8080}
  tomcat:
    # Allow large multipart bodies (backup DB dumps). -1 = unlimited so
    # Tomcat doesn't reject the body before Spring's multipart handler runs.
    max-swallow-size: -1
    max-http-form-post-size: -1

spring:
  application: { name: pawnbroking-cloud-api }
  servlet:
    multipart:
      # Bill/customer images are small, but backup DB dumps are 100MB+.
      # Default (1MB/10MB) caused HTTP 413. Incoming multipart is written
      # straight to disk (threshold 0) and the controller streams it to the
      # box via getInputStream(), so the cloud never holds the whole file
      # in RAM regardless of this ceiling.
      max-file-size: ${MAX_UPLOAD_SIZE:1GB}
      max-request-size: ${MAX_UPLOAD_SIZE:1GB}
      file-size-threshold: 0
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pawnbroking_cloud}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    schemas: public
    locations: classpath:db/migration

logging:
  level:
    com.magizhchi.cloud: DEBUG
    org.springframework.security.web.FilterChainProxy: INFO

pawnbroking:
  jwt:
    secret: ${JWT_SECRET:change-me-please-32-bytes-minimum-secret-key-here}
    # 6 months (180 days) — the shop owner should almost never have to log
    # in again. The mobile app just uses the token until it 401s, so this
    # JWT TTL is the effective session length.
    access-ttl-minutes: 259200
    refresh-ttl-days: 180
  # comma-separated list of tenant schemas to provision on startup
  tenants: ${TENANTS:alwarpuram,annanagar,mylocal}
  fcm:
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
    enabled: ${FCM_ENABLED:false}
  # Magizhchi Share ("the box") — used for passwordless email-OTP login
  box:
    url: ${MAGIZHCHI_BOX_URL:https://box.magizhchi.software}
  # How long an off-site backup is kept in the shop's box.
  #
  # Before this existed, nothing ever deleted a backup, so a shop's box could
  # only ever fill — and a full box still accepts the small daily PDF report
  # while refusing the large database dump. Shops watched their reports arrive
  # every morning and concluded all was well, with no database backup saved for
  # months. Retiring old ones puts storage in a steady state instead.
  backup:
    keep-days: ${BACKUP_KEEP_DAYS:30}
    # The newest few of EACH kind of file survive whatever their age, so a shop
    # whose backup job has been stopped for two months does not have its last
    # off-site copy swept away on the day somebody finally needs it.
    keep-floor: ${BACKUP_KEEP_FLOOR:7}
  # Warns before a shop's box fills, rather than after it has stopped backing
  # up. Once per crossing of 80 / 90 / 95 percent — a mail every morning is one
  # nobody reads by Friday, which is the same as no mail at all.
  quota:
    watch-enabled: ${QUOTA_WATCH_ENABLED:true}
    cron: ${QUOTA_WATCH_CRON:0 0 7 * * *}
  # Who may open /admin.html. Comma separated; each address signs in with a
  # code sent to it, so it must have a Magizhchi Share account. Read on every
  # boot and added if missing — admins are otherwise managed from the page,
  # and this variable never removes anyone.
  admin:
    emails: ${ADMIN_EMAILS:tirukaruna@gmail.com}
  # Magizhchi ID single sign-on. Set MAGIZHCHI_JWT_SECRET to the suite's
  # shared HS256 secret to let suite products (Meet's Pawn Shop rooms) call
  # this API with a Magizhchi ID token instead of a pawn login. Left blank,
  # the feature is simply off and only pawn-issued tokens are accepted.
  magizhchi:
    jwt:
      secret: ${MAGIZHCHI_JWT_SECRET:}
  # Browsers enforce CORS; the mobile app and sync agent do not. Only add
  # origins that should be able to read shop data from a web page.
  cors:
    origins: ${CORS_ORIGINS:https://meet.magizhchi.software,https://meetback.magizhchi.software,http://localhost:5173}

# Transactional mail, through Resend's HTTP API. The SAME account and verified
# sender Magizhchi Share uses for its sign-in codes — Railway blocks the SMTP
# ports (25/465/587), so HTTPS is the only way out, and one mail account is one
# thing to keep working instead of two.
#
# Only the storage warnings use this. With these unset nothing breaks: the
# warning is logged and not sent, and the job carries on.
resend:
  api-key:      ${RESEND_API_KEY:}
  from-address: ${RESEND_FROM:}

springdoc:
  swagger-ui:
    path: /swagger
