server:
  port: ${PORT:8080}
  tomcat:
    # Allow large multipart bodies (backup DB dumps). -1 = unlimited so
    # Tomcat doesn't reject the body before Spring's multipart handler runs.
    max-swallow-size: -1
    max-http-form-post-size: -1

spring:
  application: { name: pawnbroking-cloud-api }
  servlet:
    multipart:
      # Bill/customer images are small, but backup DB dumps are 100MB+.
      # Default (1MB/10MB) caused HTTP 413. Incoming multipart is written
      # straight to disk (threshold 0) and the controller streams it to the
      # box via getInputStream(), so the cloud never holds the whole file
      # in RAM regardless of this ceiling.
      max-file-size: ${MAX_UPLOAD_SIZE:1GB}
      max-request-size: ${MAX_UPLOAD_SIZE:1GB}
      file-size-threshold: 0
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pawnbroking_cloud}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    schemas: public
    locations: classpath:db/migration

logging:
  level:
    com.magizhchi.cloud: DEBUG
    org.springframework.security.web.FilterChainProxy: INFO

pawnbroking:
  jwt:
    secret: ${JWT_SECRET:change-me-please-32-bytes-minimum-secret-key-here}
    # 6 months (180 days) — the shop owner should almost never have to log
    # in again. The mobile app just uses the token until it 401s, so this
    # JWT TTL is the effective session length.
    access-ttl-minutes: 259200
    refresh-ttl-days: 180
  # comma-separated list of tenant schemas to provision on startup
  tenants: ${TENANTS:alwarpuram,annanagar,mylocal}
  fcm:
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
    enabled: ${FCM_ENABLED:false}
  # Magizhchi Share ("the box") — used for passwordless email-OTP login
  box:
    url: ${MAGIZHCHI_BOX_URL:https://box.magizhchi.software}

springdoc:
  swagger-ui:
    path: /swagger
