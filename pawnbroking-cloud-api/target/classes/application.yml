server:
  port: ${PORT:8080}

spring:
  application: { name: pawnbroking-cloud-api }
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pawnbroking_cloud}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    schemas: public
    locations: classpath:db/migration

logging:
  level:
    com.magizhchi.cloud: DEBUG
    org.springframework.security.web.FilterChainProxy: INFO

pawnbroking:
  jwt:
    secret: ${JWT_SECRET:change-me-please-32-bytes-minimum-secret-key-here}
    access-ttl-minutes: 60
    refresh-ttl-days: 30
  # comma-separated list of tenant schemas to provision on startup
  tenants: ${TENANTS:alwarpuram,annanagar,mylocal}
  fcm:
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
    enabled: ${FCM_ENABLED:false}
  # Magizhchi Share ("the box") — used for passwordless email-OTP login
  box:
    url: ${MAGIZHCHI_BOX_URL:https://box.magizhchi.software}

springdoc:
  swagger-ui:
    path: /swagger
