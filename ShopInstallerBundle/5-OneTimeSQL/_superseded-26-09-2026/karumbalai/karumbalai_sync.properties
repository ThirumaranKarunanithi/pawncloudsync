# =====================================================================
#  KARUMBALAI — sync agent config
#  Copy this to the shop PC at the FIXED path (create the folder if needed):
#     C:\ProgramData\PawnBroking\sync.properties
#  The agent reads ONLY from there, NOT from its install folder.
#
#  Fill in the two <...> values before starting the service:
#    <PGPASS>   the PostgreSQL password set during install on the shop PC
#    mbk_...    the api_key printed by step 4 of karumbalai_cloud_provision.sql
# =====================================================================

db.url=jdbc:postgresql://localhost:5432/pawnbroking
db.user=postgres
db.password=<PGPASS>

cloud.url=https://devpawn.magizhchi.academy
cloud.api_key=mbk_PASTE_THE_KEY_FROM_STEP_4_HERE
shop.id=karumbalai

batch.size=200
poll.interval.ms=5000
health.port=17654
schema.guard.interval.ms=30000
image.scan.interval.ms=60000
backup.retention.days=30
