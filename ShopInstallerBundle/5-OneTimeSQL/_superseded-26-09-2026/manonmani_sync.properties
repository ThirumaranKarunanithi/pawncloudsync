# =====================================================================
#  MANONMANI - sync agent config
#  Save on the shop PC at the FIXED path (create the folder if needed):
#     C:\ProgramData\PawnBroking\sync.properties
#  The agent reads ONLY from there, NOT from its install folder.
#  In Notepad choose "Save as type: All files" so it does not become
#  sync.properties.txt.
#
#  Replace the two FILL IN values before starting the service. Nothing
#  after the = but the value itself - no spaces, no quotes.
#
#  Start the service only after R6 of that file says  schema | ok.
# =====================================================================

# --- Local PostgreSQL ---
db.url=jdbc:postgresql://localhost:5432/pawnbroking
db.user=postgres
# FILL IN: the PostgreSQL password pgAdmin connects with on this PC
db.password=PUT_THE_POSTGRES_PASSWORD_HERE

# --- Cloud endpoint + per-shop identity ---
cloud.url=https://devpawn.magizhchi.academy
# FILL IN: the mbk_... key from R5 of manonmani_cloud_provision.sql
cloud.api_key=mbk_PASTE_THE_KEY_FROM_R5_HERE
shop.id=manonmani

# --- Tuning (defaults are safe; change only if instructed) ---
# The cloud takes ~0.4s per event; 200 exceeds the agent's 30s request
# timeout and every batch is aborted and retried forever.
batch.size=25
poll.interval.ms=5000
health.port=17654
schema.guard.interval.ms=30000
image.scan.interval.ms=60000
image.upload.interval.ms=1100

# Backups: only sync files touched in the last N days (0 = all).
backup.retention.days=30
backup.gzip=true
backup.gzip.min.bytes=5242880

# Optional image root override. Leave commented so the agent reads
# camera_temp_file_name per company from company_other_settings.
#image.root=D:\\Pawnbroking\\pawnbrokingImages\\Test
